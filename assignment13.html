<!DOCTYPE html>
<html>
<head>
  <title>Weekly Timetable</title>
  <style>
    table {
      border-collapse: collapse;
      text-align: center;
      font-family: "Times New Roman", serif;
    }
    th, td {
      border: 1px solid black;
      padding: 6px 12px;
    }
    caption {
      font-weight: bold;
      margin-bottom: 4px;
    }
  </style>
</head>
<body>

  <table>
    <caption>Weekly Timetable</caption>
    <tr>
      <th>Day</th>
      <th>9-10</th>
      <th>10-11</th>
      <th>11-12</th>
    </tr>
    <tr>
      <td>Mon</td>
      <td>Maths</td>
      <td>HTML</td>
      <td rowspan="2">Web Lab</td>
    </tr>
    <tr>
      <td>Tue</td>
      <td>DBMS</td>
      <td>OS</td>
    </tr>
    <tr>
      <td>Wed</td>
      <td colspan="3">Seminar</td>
    </tr>
  </table>

</body>
</html>

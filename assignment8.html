<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Links demo</title>
</head>
<body id="top">

  <p>Links demo</p>

  <a href="https://www.example.com" target="_blank">External link</a><br>
  <a href="#bottom">Jump to bottom</a><br>
  <a href="mailto:someone@example.com">Email us</a><br>
  <a href="https://www.example.com">
    <img src="logo.png" alt="Logo" width="120" height="50">
  </a>

  <!-- Spacing to push the bottom section down -->
  <div style="height: 300px;"></div>

  <p id="bottom">Bottom. <a href="#top">Back to top</a></p>

</body>
</html>

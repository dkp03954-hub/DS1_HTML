<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Accessible Page</title>
  <style>
    body {
      font-family: "Times New Roman", Times, serif;
      padding: 20px 50px;
    }
    .image-container {
      margin: 20px 0;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .broken-img-box {
      width: 220px;
      height: 22px;
      border: 1px solid #ccc;
      display: flex;
      justify-content: center;
      align-items: center;
    }
  </style>
</head>
<body>

  <!-- Skip Navigation Link -->
  <a href="#main-content">Skip to main content</a>

  <!-- Primary Navigation -->
  <nav aria-label="Main navigation">
    <a href="#home">Home</a>
    <a href="#help">Help</a>
  </nav>

  <!-- Main Content Area -->
  <main id="main-content">
    <h1>Accessible Page</h1>

    <!-- Image placeholder & close button -->
    <div class="image-container">
      <img src="placeholder.jpg" alt="Descriptive alt text" class="broken-img-box">
      <button type="button" aria-label="Close">X</button>
    </div>

    <!-- Search Form -->
    <form role="search">
      <label for="search-input">Search:</label>
      <input type="text" id="search-input" name="q">
    </form>
  </main>

</body>
</html>

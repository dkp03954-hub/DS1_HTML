<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Registration Form</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
    }
    input {
      display: block;
      margin-bottom: 12px;
      padding: 4px;
    }
    input[type="number"] {
      width: 60px;
    }
  </style>
</head>
<body>

  <form action="#" method="post">
    <input type="text" name="fullname" placeholder="Full name" required>
    
    <input type="email" name="email" placeholder="you@college.edu" required>
    
    <input type="tel" name="mobile" placeholder="10-digit mobile" pattern="[0-9]{10}" maxlength="10" required>
    
    <input type="password" name="password" placeholder="Min 6 characters" minlength="6" required>
    
    <input type="number" name="age" placeholder="Age (17-99)" min="17" max="99" required>
    
    <button type="submit">Register</button>
  </form>

</body>
</html>

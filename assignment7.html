<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Navigation Bar</title>
  <style>
    body {
      margin: 20px;
      background-color: #ffffff;
    }

    nav {
      background-color: #333333;
      padding: 16px 25px;
      display: flex;
      gap: 35px;
    }

    nav a {
      color: #f0f0f0;
      text-decoration: none;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 16px;
    }

    nav a:hover {
      color: #cccccc;
    }
  </style>
</head>
<body>

  <nav>
    <a href="#home">Home</a>
    <a href="#about">About</a>
    <a href="#courses">Courses</a>
    <a href="#contact">Contact</a>
  </nav>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
  <title>Student Marks</title>
  <style>
    table {
      border-collapse: collapse;
    }
    th, td {
      border: 1px solid black;
      padding: 6px 10px;
      text-align: left;
    }
  </style>
</head>
<body>

  <table>
    <caption>Student Marks</caption>
    <tr>
      <th>Roll</th>
      <th>Name</th>
      <th>Marks</th>
    </tr>
    <tr>
      <td>1</td>
      <td>Aman</td>
      <td>85</td>
    </tr>
    <tr>
      <td>2</td>
      <td>Riya</td>
      <td>92</td>
    </tr>
    <tr>
      <td colspan="2">Average</td>
      <td>88.5</td>
    </tr>
  </table>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Lab Schedule</title>
  <style>
    table {
      border-collapse: collapse;
      text-align: center;
      font-family: Georgia, serif;
    }
    th, td {
      border: 1px solid #888;
      padding: 8px 14px;
    }
    /* Nested table styling */
    .nested-table {
      margin: 4px auto;
      text-align: left;
    }
    .nested-table th, .nested-table td {
      padding: 6px 12px;
    }
  </style>
</head>
<body>

  <table>
    <thead>
      <tr>
        <th>Day</th>
        <th>Lab Batches</th>
        <th>Faculty</th>
        <th>Room</th>
        <th>Time</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>Friday</td>
        <td>
          <table class="nested-table">
            <thead>
              <tr>
                <th>Batch</th>
                <th>System</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td>A1</td>
                <td>PC 1-20</td>
              </tr>
              <tr>
                <td>A2</td>
                <td>PC 21-40</td>
              </tr>
            </tbody>
          </table>
        </td>
        <td>Dr. Sharma</td>
        <td>Lab 2</td>
        <td>2-4 PM</td>
      </tr>
    </tbody>
  </table>

</body>
</html>

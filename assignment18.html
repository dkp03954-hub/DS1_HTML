<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ABC College Admission 2026</title>
    <style>
        body {
            font-family: "Times New Roman", Times, serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 650px;
            border: 1px solid #8a9b8e;
            padding: 5px 50px 10px 50px;
            box-sizing: border-box;
        }
        header {
            background-color: #131c7a;
            color: white;
            text-align: center;
            padding: 18px 0;
            margin-bottom: 20px;
        }
        header h1 {
            margin: 0;
            font-size: 24px;
        }
        .content {
            width: 400px;
            margin: 0 auto;
        }
        h2 {
            font-size: 18px;
            margin-bottom: 10px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 15px;
            font-size: 13px;
        }
        caption {
            margin-bottom: 4px;
            font-size: 13px;
        }
        th, td {
            border: 1px solid #a0a0a0;
            padding: 5px 8px;
            text-align: left;
        }
        th {
            background-color: #eef1fa;
            text-align: center;
        }
        fieldset {
            border: 1px solid #a0a0a0;
            padding: 10px 12px;
            margin-bottom: 15px;
            font-size: 13px;
        }
        legend {
            padding: 0 4px;
        }
        .form-group {
            margin-bottom: 12px;
        }
        label {
            display: block;
            margin-bottom: 2px;
        }
        input[type="text"],
        input[type="email"] {
            width: 185px;
            padding: 3px;
            border: 1px solid #767676;
            border-radius: 2px;
        }
        select {
            padding: 2px 4px;
            border: 1px solid #767676;
            border-radius: 3px;
            background-color: #f0f0f0;
        }
        textarea {
            width: 325px;
            height: 48px;
            border: 1px solid #767676;
            border-radius: 2px;
        }
        button {
            padding: 3px 8px;
            border: 1px solid #767676;
            border-radius: 3px;
            background-color: #efefef;
            cursor: pointer;
            font-family: Arial, sans-serif;
            font-size: 12px;
        }
        footer {
            background-color: #131c7a;
            color: white;
            text-align: center;
            padding: 7px 0;
            font-size: 12px;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>ABC College Admission 2026</h1>
    </header>

    <div class="content">
        <h2>Courses and Fees</h2>

        <table>
            <caption>Available Courses</caption>
            <thead>
                <tr>
                    <th>Course</th>
                    <th>Seats</th>
                    <th>Fees</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>B.Tech CSE</td>
                    <td>120</td>
                    <td>&#8377;90,000</td>
                </tr>
                <tr>
                    <td>BCA</td>
                    <td>60</td>
                    <td>&#8377;45,000</td>
                </tr>
            </tbody>
        </table>

        <form action="#" method="post">
            <fieldset>
                <legend>Application Form</legend>
                
                <div class="form-group">
                    <label for="name">Name:</label>
                    <input type="text" id="name" name="name" required>
                </div>

                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <div class="form-group">
                    <label for="course">Course:</label>
                    <select id="course" name="course">
                        <option value="btech-cse">B.Tech CSE</option>
                        <option value="bca">BCA</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="statement">Statement:</label>
                    <textarea id="statement" name="statement"></textarea>
                </div>

                <button type="submit">Apply</button>
            </fieldset>
        </form>
    </div>

    <footer>
        &copy; 2026 ABC College
    </footer>
</div>

</body>
</html>

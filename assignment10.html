<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Elements Example</title>
</head>
<body>

    <!-- Image Section -->
    <h3>Image</h3>
    <img src="campus.jpg" alt="College campus" width="150" height="150">

    <!-- Video Section -->
    <h3>Video</h3>
    <video width="200" height="150" controls>
        <source src="sample-video.mp4" type="video/mp4">
        Your browser does not support the video tag.
    </video>

    <!-- Audio Section -->
    <h3>Audio</h3>
    <audio controls>
        <source src="sample-audio.mp3" type="audio/mpeg">
        Your browser does not support the audio element.
    </audio>

    <!-- YouTube Embed Section -->
    <h3>YouTube</h3>
    <iframe width="300" height="200" src="https://www.youtube.com/embed/dQw4w9WgXcQ" title="YouTube video player" frameborder="0" allowfullscreen></iframe>

</body>
</html>
